name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          run-install: false
      - name: Enable pnpm binary for Changesets
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install Dependencies
        run: vp install --frozen-lockfile
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to check out repo (actions/checkout) and commit version changes (changesets/action/version)
      pull-requests: write # to create pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: false # recommended: avoid cache poisoning
          run-install: false
      - name: Enable pnpm binary for Changesets
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install Dependencies
        run: vp install --frozen-lockfile
      - name: Version packages
        id: version
        uses: changesets/action/version@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: false # recommended: avoid cache poisoning
          run-install: false
      - name: Enable pnpm binary for Changesets
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install Dependencies
        run: vp install --frozen-lockfile
      - name: Build packages
        run: vp run build
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # to check out repo (actions/checkout) and to create releases (changesets/action/publish)
      id-token: write # for trusted publishing (changesets/action/publish)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: false # recommended: avoid cache poisoning
          run-install: false
      - name: Enable pnpm binary for Changesets
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install Dependencies
        run: vp install --frozen-lockfile
      - name: Publish packages
        uses: changesets/action/publish@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
